version: "1.0"

services:
    app:
        container_name: php-fpm-lumen10-base
        build:
            context: ./
            dockerfile: docker/php/dockerfile
        volumes:
            -   ./:/opt/app-root/src
        ports:
            - "9900:9000"
        networks:
            - lumen10-base
    nginx:
        container_name: nginx-lumen10-base
        build:
            context: ./
            dockerfile: docker/nginx/dockerfile
        volumes:
            -   ./:/opt/app-root/src
        ports:
            - "8989:80"
        networks:
            - lumen10-base
        links:
            - app
networks:
    lumen10-base:
        driver: "bridge"
