# Portal de proveedores completo: MySQL + API + frontend + correo de prueba + tareas programadas.
#
#   1. copiar .env.docker.example a .env y completar las claves
#   2. docker compose up --build
#   3. abrir http://localhost:5173  (correos de prueba: http://localhost:8025)
#
# La base se inicializa la primera vez con los .sql de api/database/sql (en orden alfabético).
# Para ver el estado: docker compose ps. Para borrar los datos: docker compose down -v.
name: portal-proveedores

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: portal_proveedores
      MYSQL_USER: portal_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - datos_mysql:/var/lib/mysql
      - ./api/database/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uportal_user -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &entorno_api
      # DEMOSTRACIÓN: con APP_ENV=local y MSAL_LOCAL_DEMO=true el servidor acepta el correo que informa
      # el frontend para los usuarios internos, sin validar el token de Microsoft. No usar así en producción.
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Defina APP_KEY en .env}
      APP_TIMEZONE: America/Santiago
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: portal_proveedores
      DB_USERNAME: portal_user
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      FRONTEND_URL: http://localhost:5173
      PORTAL_URL: http://localhost:5173
      MAIL_MODO: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_ENCRYPTION: ""
      MAIL_FROM_ADDRESS: portal@proveedores.local
      MAIL_FROM_NAME: Portal de Proveedores
      DICOM_MODO: simulado
      MSAL_LOCAL_DEMO: "true"
      AMLUPDATE_ENV: qa
      AMLUPDATE_QA_BASE_URL: https://qa.amlupdate.com
      AMLUPDATE_USER: ${AMLUPDATE_USER:-}
      AMLUPDATE_TOKEN: ${AMLUPDATE_TOKEN:-}
    volumes:
      - documentos:/var/www/html/storage/app
    ports:
      - "8000:80"

  # Equivale a programar "php artisan schedule:run" cada minuto.
  programador:
    build: ./api
    restart: unless-stopped
    depends_on:
      - api
    environment: *entorno_api
    volumes:
      - documentos:/var/www/html/storage/app
    command: ["sh", "-c", "while true; do php artisan schedule:run; sleep 60; done"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_PROVEEDORES_API_URL: http://localhost:8000/v1
        VITE_LOCAL_DEMO: "true"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  datos_mysql:
  documentos:
