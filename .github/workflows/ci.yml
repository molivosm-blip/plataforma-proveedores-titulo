name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    name: API (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, openssl, pdo_mysql, pdo_sqlite, sqlite3, zip
          tools: composer:v2
      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Pruebas
        run: vendor/bin/phpunit

  frontend:
    name: Frontend (tipos, lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npx tsc -b
      - name: Lint
        run: npx eslint .
      - name: Build
        run: npm run build
